# Frontend static file serving + reverse proxy to the API/WebSocket.
#
# The API service (services/api/main.py) is the single source of truth for
# clip/thumbnail files too (it mounts ./storage internally and serves it
# under /clips and /thumbnails), so nginx just proxies those paths through
# rather than mounting storage itself — one less place file paths can
# drift out of sync.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;  # don't advertise the exact nginx version to clients

    # Baseline hardening headers. Not a substitute for the app-level API
    # key auth (services/api/main.py), just standard defense-in-depth for
    # a page that embeds live camera thumbnails/clips.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors 'none' backs up X-Frame-Options for browsers that
    # honor CSP; connect-src covers the /api and /ws proxy paths below.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' ws: wss:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /clips/ {
        proxy_pass http://api:8000/clips/;
        proxy_set_header Host $host;
    }

    location /thumbnails/ {
        proxy_pass http://api:8000/thumbnails/;
        proxy_set_header Host $host;
    }
}
