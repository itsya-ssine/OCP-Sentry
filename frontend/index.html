<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCP SENTRY — Surveillance en direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* --- OCP-inspired palette: phosphate strata + brand green --- */
    --bg-deep:#0a120f;
    --bg-panel:#111d18;
    --bg-raised:#182620;
    --border:#22342c;
    --border-soft:#1a2a23;
    --text:#eaf2ee;
    --text-dim:#8ba79c;
    --text-faint:#4c675c;

    --ocp-green:#0f9d58;
    --ocp-green-bright:#2fe38a;
    --ocp-green-deep:#0a5c37;

    --person:#4aa8c9;
    --fire:#e4572e;
    --smoke:#c9a24a;
    --stone:#6b7570;

    --radius:6px;
    --strata: linear-gradient(90deg,
        var(--ocp-green) 0 20%,
        var(--smoke) 20% 40%,
        var(--stone) 40% 60%,
        var(--ocp-green-deep) 60% 80%,
        var(--fire) 80% 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(15,157,88,0.09), transparent 60%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:22px;
    padding:14px 22px 13px;
    background:rgba(10,18,15,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  header::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--strata);
  }

  .lockup{display:flex; align-items:center; gap:12px;}
  .strata-mark{
    width:26px; height:26px; border-radius:3px; overflow:hidden; flex:none;
    display:flex; flex-direction:column;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06);
  }
  .strata-mark span{flex:1;}
  .strata-mark span:nth-child(1){background:var(--ocp-green-bright);}
  .strata-mark span:nth-child(2){background:var(--smoke);}
  .strata-mark span:nth-child(3){background:var(--stone);}
  .strata-mark span:nth-child(4){background:var(--ocp-green-deep);}

  .wordmark-group{display:flex; flex-direction:column; line-height:1;}
  .wordmark{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800; font-size:23px; letter-spacing:0.06em;
    display:flex; align-items:center; gap:8px;
  }
  .wordmark .ocp-chip{
    background:var(--ocp-green); color:#04140c; font-size:12px; font-weight:700;
    padding:2px 6px; border-radius:3px; letter-spacing:0.05em; font-family:'Inter',sans-serif;
  }
  .subline{
    font-size:10.5px; color:var(--text-faint); letter-spacing:0.16em; text-transform:uppercase;
    margin-top:3px;
  }

  .status{display:flex; align-items:center; gap:8px; margin-left:4px;}
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--ocp-green-bright);
    box-shadow:0 0 0 3px rgba(47,227,138,0.15);
  }
  .dot.offline{background:var(--fire); box-shadow:0 0 0 3px rgba(228,87,46,0.18);}
  .conn-label{font-size:11px;color:var(--text-dim); letter-spacing:0.08em;}
  .clock{font-size:11px; color:var(--text-faint); letter-spacing:0.04em; margin-left:2px;}

  .filters{margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  select{
    background:var(--bg-raised); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius); padding:7px 10px; font-size:13px; cursor:pointer;
  }
  .chip-row{display:flex; gap:6px;}
  .chip{
    border:1px solid var(--border); background:var(--bg-raised); color:var(--text-dim);
    padding:6px 13px; border-radius:999px; font-size:11.5px; font-weight:700;
    letter-spacing:0.06em; cursor:pointer; transition:all .15s ease;
  }
  .chip:hover{color:var(--text); border-color:var(--text-faint);}
  .chip.active{color:#04140c; border-color:transparent;}
  .chip[data-label="all"].active{background:var(--text);}
  .chip[data-label="person"].active{background:var(--person);}
  .chip[data-label="fire"].active{background:var(--fire);}
  .chip[data-label="smoke"].active{background:var(--smoke);}

  /* ---------- main ---------- */
  main{padding:26px 22px 60px; max-width:1400px; margin:0 auto;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }

  .card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-left:3px solid var(--stone);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.35);}
  .card[data-label="person"]{border-left-color:var(--person);}
  .card[data-label="fire"]{border-left-color:var(--fire);}
  .card[data-label="smoke"]{border-left-color:var(--smoke);}

  .card.enter{animation:flashin .9s ease;}
  @keyframes flashin{
    0%{box-shadow:0 0 0 2px rgba(47,227,138,0.55); background:var(--bg-raised);}
    100%{box-shadow:0 0 0 0 rgba(47,227,138,0); background:var(--bg-panel);}
  }

  .thumb-wrap{position:relative; aspect-ratio:16/9; background:#000; overflow:hidden;}
  .thumb-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-wrap .noimg{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:12px;
  }
  .osd{
    position:absolute; left:8px; bottom:8px;
    font-size:11px; letter-spacing:0.03em;
    color:#d9ffe6;
    background:rgba(0,0,0,0.55);
    padding:2px 6px; border-radius:3px;
  }
  .badge{
    position:absolute; top:8px; right:8px;
    font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; color:#04140c;
  }
  .badge[data-label="person"]{background:var(--person);}
  .badge[data-label="fire"]{background:var(--fire);}
  .badge[data-label="smoke"]{background:var(--smoke);}

  .live-pill{
    position:absolute; top:8px; left:8px;
    display:flex; align-items:center; gap:5px;
    font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 8px 3px 6px; border-radius:999px;
    background:rgba(0,0,0,0.65); color:#ff5f5f;
  }
  .live-pill .dot{
    width:6px; height:6px; border-radius:50%; background:#ff3b3b;
    animation:livepulse 1.1s ease-in-out infinite;
  }
  @keyframes livepulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.35; transform:scale(0.75);}
  }
  .card.is-open{border-left-color:#ff3b3b;}

  .card-body{padding:10px 12px 12px;}
  .card-cam{font-size:13.5px; font-weight:600;}
  .card-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:3px; font-size:11.5px; color:var(--text-dim);
  }

  .empty{
    text-align:center; padding:70px 20px 30px; color:var(--text-dim);
  }
  .empty svg{margin-bottom:14px;}
  .empty .sub{font-size:12.5px; color:var(--text-faint); margin-top:6px;}

  .loadmore{
    display:block; margin:26px auto 0; padding:9px 22px;
    background:var(--bg-raised); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:500;
  }
  .loadmore:hover{border-color:var(--ocp-green); color:var(--ocp-green-bright);}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(3,7,5,0.84);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:8px;
    max-width:820px; width:100%; overflow:hidden;
  }
  .modal video, .modal .noclip{width:100%; display:block; background:#000; aspect-ratio:16/9;}
  .modal .noclip{display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:13px;}
  .modal-info{padding:16px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
  .modal-info h2{font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:19px; margin:0 0 4px; letter-spacing:0.02em;}
  .modal-info .meta{font-size:12.5px; color:var(--text-dim); line-height:1.6;}
  .modal-close{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px; flex:none;
  }
  .modal-close:hover{color:var(--text); border-color:var(--ocp-green);}

  a:focus-visible, button:focus-visible, select:focus-visible, .card:focus-visible{
    outline:2px solid var(--ocp-green-bright); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    .card, .card.enter{animation:none; transition:none;}
  }

  @media (max-width:720px){
    header{flex-wrap:wrap; row-gap:12px;}
    .filters{margin-left:0; width:100%;}
    .clock{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="lockup">
    <div class="strata-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="wordmark-group">
      <div class="wordmark"><span class="ocp-chip">OCP</span>SENTRY</div>
      <div class="subline">Sûreté industrielle · sites miniers</div>
    </div>
  </div>

  <div class="status">
    <span class="dot" id="connDot"></span>
    <span class="conn-label" id="connLabel">CONNEXION…</span>
    <span class="clock mono" id="clock"></span>
  </div>

  <div class="filters">
    <div class="chip-row" id="labelChips">
      <button class="chip active" data-label="all">TOUT</button>
      <button class="chip" data-label="person">PERSONNE</button>
      <button class="chip" data-label="fire">FEU</button>
      <button class="chip" data-label="smoke">FUMÉE</button>
    </div>
    <select id="cameraSelect"><option value="">Tous les sites</option></select>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="36" r="6" fill="#2fe38a" opacity="0.9"/>
      <circle cx="36" cy="36" r="16" stroke="#2fe38a" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="26" stroke="#2fe38a" stroke-opacity="0.2" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="35" stroke="#2fe38a" stroke-opacity="0.1" stroke-width="1.5"/>
    </svg>
    <div>Aucune alerte pour le moment — le système surveille vos sites.</div>
    <div class="sub">Les nouvelles détections apparaîtront ici automatiquement.</div>
  </div>
  <button class="loadmore" id="loadMoreBtn" style="display:none;">Charger les alertes précédentes</button>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div id="modalMediaSlot"></div>
    <div class="modal-info">
      <div>
        <h2 id="modalTitle">—</h2>
        <div class="meta mono" id="modalMeta">—</div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 40;
let offset = 0;
let activeLabel = "all";
let activeCamera = "";
let loadedEvents = [];

const LABELS_FR = { person: 'Personne', fire: 'Feu', smoke: 'Fumée' };
function labelText(l){ return LABELS_FR[l] || l; }

// --- HTML escaping -----------------------------------------------------
// camera_name/label/paths come from server-side config and a fixed label
// set today, but they still flow through insertAdjacentHTML below —
// escaping them here is cheap defense-in-depth against stored XSS if
// that ever changes (e.g. a future "rename camera" feature).
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// --- API key -------------------------------------------------------------
// Every REST/WS call must present the API key configured server-side
// (see services/api/main.py). It's asked for once and cached in
// localStorage so the person isn't re-prompted on every page load; it
// never leaves the browser except as a header/query param straight back
// to this same origin's API.
function getApiKey(){
  let key = localStorage.getItem('nvr_api_key');
  while (!key){
    key = window.prompt("Clé API requise pour accéder à OCP SENTRY :");
    if (key) localStorage.setItem('nvr_api_key', key.trim());
  }
  return key.trim();
}
async function apiFetch(path, opts = {}){
  const headers = Object.assign({}, opts.headers, { 'X-API-Key': getApiKey() });
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401){
    // stored key is stale/wrong — clear it and re-prompt on next call
    localStorage.removeItem('nvr_api_key');
  }
  return res;
}

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const connDot = document.getElementById('connDot');
const connLabel = document.getElementById('connLabel');
const cameraSelect = document.getElementById('cameraSelect');
const clockEl = document.getElementById('clock');

function updateClock(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  clockEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
updateClock();
setInterval(updateClock, 1000);

function fmtRelative(iso){
  const d = new Date(iso);
  const diffMs = Date.now() - d.getTime();
  const s = Math.round(diffMs/1000);
  if (s < 5) return "à l'instant";
  if (s < 60) return "il y a " + s + "s";
  const m = Math.round(s/60);
  if (m < 60) return "il y a " + m + "m";
  const h = Math.round(m/60);
  if (h < 24) return "il y a " + h + "h";
  const days = Math.round(h/24);
  return "il y a " + days + "j";
}

function fmtOsd(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function cardHTML(ev, isNew){
  const isOpen = ev.status === 'open';
  const thumb = ev.thumbnail_path
    ? `<img src="/${encodeURI(ev.thumbnail_path)}?api_key=${encodeURIComponent(getApiKey())}" alt="${esc(labelText(ev.label))} détecté sur ${esc(ev.camera_name)}" loading="lazy">`
    : `<div class="noimg">aucune miniature</div>`;
  const livePill = isOpen ? `<span class="live-pill"><span class="dot"></span>en cours</span>` : "";
  const metaRight = isOpen ? "toujours détecté" : esc(fmtRelative(ev.start_time));
  return `
    <article class="card${isNew ? ' enter' : ''}${isOpen ? ' is-open' : ''}" data-label="${esc(ev.label)}" data-id="${esc(ev.id)}" tabindex="0" role="button">
      <div class="thumb-wrap">
        ${thumb}
        ${livePill}
        <span class="badge" data-label="${esc(ev.label)}">${esc(labelText(ev.label))}</span>
        <span class="osd mono">${esc(ev.camera_name)} · ${esc(fmtOsd(ev.start_time))}</span>
      </div>
      <div class="card-body">
        <div class="card-cam">${esc(ev.camera_name)}</div>
        <div class="card-meta">
          <span>confiance ${(ev.score*100).toFixed(0)}%</span>
          <span>${metaRight}</span>
        </div>
      </div>
    </article>`;
}

function passesFilter(ev){
  if (activeLabel !== "all" && ev.label !== activeLabel) return false;
  if (activeCamera && ev.camera_id !== activeCamera) return false;
  return true;
}

function renderAll(){
  grid.innerHTML = "";
  const visible = loadedEvents.filter(passesFilter);
  emptyState.style.display = visible.length ? "none" : "block";
  grid.style.display = visible.length ? "grid" : "none";
  visible.forEach(ev => grid.insertAdjacentHTML('beforeend', cardHTML(ev, false)));
  attachCardHandlers();
}

function prependEvent(ev){
  loadedEvents.unshift(ev);
  if (!passesFilter(ev)) return;
  emptyState.style.display = "none";
  grid.style.display = "grid";
  grid.insertAdjacentHTML('afterbegin', cardHTML(ev, true));
  attachCardHandlers();
}

// Replaces an already-rendered card in place (e.g. an "ongoing" alert that
// just closed and now has a final duration/clip), preserving its position
// in the grid rather than re-sorting it to the top.
function updateEvent(ev){
  const idx = loadedEvents.findIndex(e => e.id === ev.id);
  if (idx === -1){ prependEvent(ev); return; }
  loadedEvents[idx] = ev;
  const card = grid.querySelector(`.card[data-id="${CSS.escape(ev.id)}"]`);
  if (card && passesFilter(ev)){
    card.outerHTML = cardHTML(ev, false);
    attachCardHandlers();
  }
}

// Removes a card entirely (used when a brief flicker gets discarded before
// it ever reached min_event_duration_seconds).
function removeEvent(id){
  loadedEvents = loadedEvents.filter(e => e.id !== id);
  const card = grid.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (card) card.remove();
  if (!loadedEvents.filter(passesFilter).length){
    emptyState.style.display = "block";
    grid.style.display = "none";
  }
}

function attachCardHandlers(){
  grid.querySelectorAll('.card').forEach(card => {
    card.onclick = () => openModal(card.dataset.id);
    card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(card.dataset.id); } };
  });
}

async function fetchEvents(reset){
  const params = new URLSearchParams({ limit: PAGE_SIZE, offset: reset ? 0 : offset });
  if (activeLabel !== "all") params.set("label", activeLabel);
  if (activeCamera) params.set("camera_id", activeCamera);

  const res = await apiFetch(`/api/events?${params.toString()}`);
  const events = await res.json();

  if (reset){
    loadedEvents = events;
    offset = events.length;
    renderAll();
  } else {
    events.forEach(ev => loadedEvents.push(ev));
    offset += events.length;
    events.filter(passesFilter).forEach(ev => grid.insertAdjacentHTML('beforeend', cardHTML(ev, false)));
    attachCardHandlers();
  }
  loadMoreBtn.style.display = events.length === PAGE_SIZE ? "block" : "none";
}

async function loadCameras(){
  const res = await apiFetch('/api/cameras');
  const cams = await res.json();
  cams.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    cameraSelect.appendChild(opt);
  });
}

function openModal(id){
  const ev = loadedEvents.find(e => e.id === id);
  if (!ev) return;
  document.getElementById('modalTitle').textContent = `${labelText(ev.label).toUpperCase()} — ${ev.camera_name}`;
  const endLabel = ev.end_time ? fmtOsd(ev.end_time) : "en cours…";
  document.getElementById('modalMeta').textContent =
    `${fmtOsd(ev.start_time)} → ${endLabel}   ·   confiance ${(ev.score*100).toFixed(0)}%`;

  const slot = document.getElementById('modalMediaSlot');
  slot.innerHTML = ev.clip_path
    ? `<video src="/${encodeURI(ev.clip_path)}?api_key=${encodeURIComponent(getApiKey())}" controls autoplay></video>`
    : `<div class="noclip">${ev.status === 'open' ? "Événement en cours — le clip sera disponible une fois terminé" : "Aucun clip n'a été enregistré pour cet événement"}</div>`;

  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('modalMediaSlot').innerHTML = "";
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

document.getElementById('labelChips').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#labelChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  activeLabel = btn.dataset.label;
  fetchEvents(true);
});

cameraSelect.addEventListener('change', () => {
  activeCamera = cameraSelect.value;
  fetchEvents(true);
});

loadMoreBtn.addEventListener('click', () => fetchEvents(false));

function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws/alerts?api_key=${encodeURIComponent(getApiKey())}`);

  ws.onopen = () => {
    connDot.classList.remove('offline');
    connLabel.textContent = 'EN DIRECT';
  };
  ws.onclose = (evt) => {
    connDot.classList.add('offline');
    connLabel.textContent = 'RECONNEXION…';
    if (evt.code === 4401) localStorage.removeItem('nvr_api_key');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (msg) => {
    try {
      const payload = JSON.parse(msg.data);
      if (payload.type === 'discarded'){
        removeEvent(payload.id);
      } else if (payload.type === 'closed'){
        updateEvent(payload);
      } else {
        // 'opened' (or a payload from an older backend with no type field)
        prependEvent(payload);
      }
    } catch (err) { console.error('bad ws payload', err); }
  };
}

loadCameras();
fetchEvents(true);
connectWS();
</script>
</body>
</html>
